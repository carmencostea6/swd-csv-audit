<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSV Audit</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            color: #172033;
            background: #f4f6fa;
        }

        body {
            max-width: 720px;
            margin: 4rem auto;
            padding: 0 1.25rem;
        }

        main {
            padding: 2rem;
            background: #fff;
            border: 1px solid #e1e6ef;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgb(23 32 51 / 6%);
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }

        button {
            padding: 0.65rem 1rem;
            color: white;
            background: #2457c5;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #result {
            margin-top: 1.5rem;
        }

        pre {
            overflow-x: auto;
            padding: 1rem;
            background: #f4f6fa;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<main>
    <h1>CSV Audit</h1>
    <p>Upload a CSV file to inspect its headers, row count, and empty cells.</p>
    <form id="upload-form">
        <input id="file" name="file" type="file" accept=".csv,text/csv" required>
        <button id="submit-button" type="submit">Analyze CSV</button>
    </form>
    <section id="result" aria-live="polite">
        <h2>Result</h2>
        <p id="message">Choose a CSV file to get started.</p>
        <pre id="report" hidden></pre>
    </section>
</main>
<script>
    const form = document.querySelector("#upload-form");
    const fileInput = document.querySelector("#file");
    const button = document.querySelector("#submit-button");
    const message = document.querySelector("#message");
    const reportOutput = document.querySelector("#report");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) {
            message.textContent = "Choose a CSV file before analyzing.";
            reportOutput.hidden = true;
            return;
        }

        const formData = new FormData();
        formData.append("file", file);
        button.disabled = true;
        message.textContent = "Analyzing...";
        reportOutput.hidden = true;

        try {
            const response = await fetch("/api/csv/analyze", {
                method: "POST",
                body: formData
            });
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.error || "Unable to analyze this CSV file.");
            }
            message.textContent = "Analysis complete.";
            reportOutput.textContent = JSON.stringify(result, null, 2);
            reportOutput.hidden = false;
        } catch (error) {
            message.textContent = error.message || "Unable to reach the CSV analyzer.";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
